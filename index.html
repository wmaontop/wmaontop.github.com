<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapClone Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div id="cameraPage" class="page active">
    <header>👻 SnapClone</header>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="cameraControls">
      <button onclick="openPage('chatsPage')">💬</button>
      <button class="snapBtn" onclick="takeSnap()">📸</button>
      <button onclick="switchCamera()">🔄</button>
    </div>
  </div>

  <div id="previewPage" class="page">
    <img id="previewImg">
    <input id="captionInput" placeholder="Add caption...">
    <h3>Send to:</h3>
    <div id="friendSendList"></div>
    <button onclick="postStory()">Post to Story</button>
    <button onclick="openPage('cameraPage')">Back</button>
  </div>

  <div id="chatsPage" class="page">
    <header>
      <button onclick="openPage('cameraPage')">📸</button>
      Chats
      <button onclick="openPage('storiesPage')">📖</button>
    </header>

    <div id="chatList"></div>

    <div class="addFriend">
      <input id="friendName" placeholder="Add friend name">
      <button onclick="addFriend()">Add</button>
    </div>
  </div>

  <div id="chatRoomPage" class="page">
    <header>
      <button onclick="openPage('chatsPage')">←</button>
      <span id="chatTitle"></span>
    </header>

    <div id="messages"></div>

    <div class="messageBox">
      <input id="messageInput" placeholder="Send chat...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div id="storiesPage" class="page">
    <header>
      <button onclick="openPage('chatsPage')">←</button>
      Stories
    </header>
    <div id="stories"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
